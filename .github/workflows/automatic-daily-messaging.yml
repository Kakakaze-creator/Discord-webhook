name: Daily Discord Message

on:
  schedule:
    - cron: "0 12 * * *"
      timezone: "Africa/Lagos"

  workflow_dispatch:

# Only one copy of this workflow may update the counter at a time.
concurrency:
  group: daily-discord-counter
  cancel-in-progress: false

# The workflow needs permission to update day.txt.
permissions:
  contents: write

jobs:
  send-message:
    runs-on: ubuntu-latest

    steps:
      # Download the repository.
      - name: Check out repository
        uses: actions/checkout@v7

      # Read the current day number.
      # If day.txt doesn't exist, start at Day 2.
      - name: Read day number
        id: day
        shell: bash
        run: |
          DAY=$(cat day.txt 2>/dev/null || echo 2)

          # Make sure DAY contains only a number.
          if ! [[ "$DAY" =~ ^[0-9]+$ ]]; then
            echo "Error: day.txt does not contain a valid number."
            exit 1
          fi

          echo "day=$DAY" >> "$GITHUB_OUTPUT"
          echo "Current day: $DAY"

      # Send:
      # Day X of sending a crying emoji till @hihijsonel comes back
      - name: Send day message
        env:
          WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          DAY: ${{ steps.day.outputs.day }}
        shell: bash
        run: |
          PAYLOAD=$(python3 - <<'PY'
          import json
          import os

          day = os.environ["DAY"]

          print(json.dumps({
              "content": (
                  f"Day {day} of sending a crying emoji till "
                  f"<@763450243693674517> comes back"
              )
          }))
          PY
          )

          curl \
            --fail \
            --silent \
            --show-error \
            -H "Content-Type: application/json" \
            -X POST \
            --data "$PAYLOAD" \
            "$WEBHOOK_URL"

          echo "Day message sent successfully."

      # Send 😭 as a completely separate Discord message.
      - name: Send crying emoji
        env:
          WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        shell: bash
        run: |
          curl \
            --fail \
            --silent \
            --show-error \
            -H "Content-Type: application/json" \
            -X POST \
            --data '{"content":"😭"}' \
            "$WEBHOOK_URL"

          echo "Crying emoji sent successfully."

      # Increase the counter by 1.
      - name: Increment day number
        run: |
          DAY=$(cat day.txt 2>/dev/null || echo 2)
          NEXT_DAY=$((DAY + 1))

          echo "$NEXT_DAY" > day.txt

          echo "Next day will be: $NEXT_DAY"

      # Commit and push the updated counter.
      - name: Save new day number
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Only commit if day.txt actually changed.
          if git diff --quiet -- day.txt; then
            echo "No changes to day.txt. Nothing to commit."
            exit 0
          fi

          git add day.txt

          git commit -m "Update daily crying emoji counter"

          git push
