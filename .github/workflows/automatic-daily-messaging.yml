name: Daily Discord Message

on:
  schedule:
    - cron: "0 12 * * *"
      timezone: "Africa/Lagos"

  workflow_dispatch:

# Allow the workflow to update day.txt
permissions:
  contents: write

jobs:
  send-message:
    runs-on: ubuntu-latest

    steps:
      # Download the repository so we can read and update day.txt
      - name: Check out repository
        uses: actions/checkout@v6

      # Read the current day number
      - name: Read day number
        id: day
        run: |
          DAY=$(cat day.txt)
          echo "day=$DAY" >> "$GITHUB_OUTPUT"

      # Send the first Discord message
      - name: Send day message
        env:
          WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          DAY: ${{ steps.day.outputs.day }}
        run: |
          curl \
            -H "Content-Type: application/json" \
            -X POST \
            -d "{\"content\":\"Day $DAY of sending a crying emoji till <@763450243693674517> comes back\"}" \
            "$WEBHOOK_URL"

      # Send the crying emoji as a separate Discord message
      - name: Send crying emoji
        env:
          WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          curl \
            -H "Content-Type: application/json" \
            -X POST \
            -d '{"content":"😭"}' \
            "$WEBHOOK_URL"

      # Increase the day number by 1
      - name: Increment day number
        run: |
          DAY=$(cat day.txt)
          NEXT_DAY=$((DAY + 1))
          echo "$NEXT_DAY" > day.txt

      # Save the new number back to GitHub
      - name: Save new day number
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add day.txt
          git commit -m "Update daily crying emoji counter" || exit 0
          git push
